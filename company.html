<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDI — Company Rating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .profile-hero{
    padding: 60px 0 20px;
    border-top: none;
  }
  .back-link{
    font-family: var(--serif-num);
    font-size: 12.5px;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 34px;
  }
  .back-link:hover{ color: var(--velocity); }

  .profile-top{
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 22px;
  }
  .profile-logo{
    width: 72px;
    height: 72px;
    object-fit: contain;
    border-radius: var(--radius);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    padding: 10px;
    flex-shrink: 0;
  }
  .profile-logo-fallback{
    width: 72px;
    height: 72px;
    border-radius: var(--radius);
    background: linear-gradient(150deg, var(--energy), var(--velocity) 130%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--display);
    font-weight: 700;
    font-size: 24px;
    color: #0A0D13;
    flex-shrink: 0;
  }
  .profile-sector{
    font-family: var(--serif-num);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 6px;
  }
  .profile-headline{
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(24px, 3.4vw, 34px);
    line-height: 1.2;
    margin-bottom: 26px;
    max-width: 24ch;
  }
  .profile-body{
    font-size: 16.5px;
    color: var(--ink-dim);
    line-height: 1.75;
    max-width: 68ch;
    margin-bottom: 50px;
  }

  .profile-scores{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 36px;
    margin-bottom: 44px;
  }
  .profile-score-row{
    display: grid;
    grid-template-columns: 70px 1fr 50px;
    align-items: center;
    gap: 16px;
    font-family: var(--serif-num);
    font-size: 13px;
    margin-bottom: 18px;
  }
  .profile-score-row:last-of-type{ margin-bottom: 0; }
  .profile-score-row .label{ color: var(--ink-dim); letter-spacing: 0.04em; }
  .profile-score-row .bar-track{
    height: 8px;
    background: rgba(233,236,243,0.08);
    border-radius: 4px;
    overflow: hidden;
  }
  .profile-score-row .bar-fill{
    height: 100%;
    border-radius: 4px;
    transition: width 0.8s ease;
  }
  .profile-score-row.ads .bar-fill{ background: var(--energy); }
  .profile-score-row.ows .bar-fill{ background: #FFB199; }
  .profile-score-row.rvs .bar-fill{ background: var(--velocity); }
  .profile-score-row .value{ text-align: right; color: var(--ink); font-size: 15px; }

  .profile-ddi{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-top: 26px;
    margin-top: 26px;
    border-top: 1px solid var(--line);
  }
  .profile-ddi .num{
    font-family: var(--serif-num);
    font-size: 56px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1;
  }
  .profile-ddi .num-caption{
    font-family: var(--serif-num);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: block;
    margin-top: 6px;
  }

  .profile-conclusion{
    border-left: 2px solid var(--velocity);
    padding: 4px 0 4px 24px;
    margin-bottom: 60px;
  }
  .profile-conclusion strong{
    display: block;
    font-family: var(--serif-num);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--velocity);
    margin-bottom: 10px;
  }
  .profile-conclusion p{
    font-size: 16px;
    color: var(--ink);
    line-height: 1.75;
    max-width: 64ch;
  }

  .not-found{
    padding: 100px 0;
    text-align: center;
  }
  .not-found h2{ margin-bottom: 14px; }
  .not-found p{ color: var(--ink-dim); margin-bottom: 26px; }
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="wordmark"><span class="dot"></span>DDI</a>
    <nav class="links">
      <a href="index.html">Ratings</a>
      <a href="methodology.html">How It Works</a>
      <a href="methodology.html#about">About</a>
      <a href="methodology.html#legal">Legal</a>
    </nav>
  </div>
</header>

<div id="profile-root"></div>

<footer>
  <div class="wrap footer-inner">
    <a href="index.html" class="wordmark"><span class="dot"></span>DDI</a>
    <p>&copy; <span id="year"></span> Daniel Ranga Dube &mdash; DUBE&ndash;Dropleton Index. All rights reserved.</p>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  function renderProfile() {
    const root = document.getElementById("profile-root");
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("c");
    const company = companies.find(c => slugify(c.name) === slug);

    if (!company) {
      root.innerHTML = `
        <section class="not-found">
          <div class="wrap">
            <h2>Report not found</h2>
            <p>This company hasn't been rated yet, or the link is out of date.</p>
            <a href="index.html" class="btn btn-primary">Back to ratings</a>
          </div>
        </section>
      `;
      document.title = "DDI — Report not found";
      return;
    }

    const ddi = calculateDDI(company.ads, company.ows, company.rvs);
    const state = getState(ddi);
    const hasLogo = company.logo && company.logo.trim() !== "";

    document.title = `${company.name} — DDI Rating`;

    root.innerHTML = `
      <section class="profile-hero">
        <div class="wrap">
          <a href="index.html" class="back-link">&larr; Back to all ratings</a>
          <div class="profile-top">
            ${hasLogo
              ? `<img class="profile-logo" src="${company.logo}" alt="${company.name} logo" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'profile-logo-fallback',textContent:getInitials('${company.name.replace(/'/g,"\\'")}')}))">`
              : `<div class="profile-logo-fallback">${getInitials(company.name)}</div>`
            }
            <div>
              <h1 class="wordmark" style="font-size:26px;">${company.name}</h1>
              <div class="profile-sector">${company.sector}</div>
            </div>
          </div>
          <h2 class="profile-headline">${company.headline}</h2>
          <p class="profile-body">${company.body}</p>
        </div>
      </section>

      <section style="border-top:none; padding-top:0;">
        <div class="wrap">
          <div class="profile-scores">
            <div class="profile-score-row ads">
              <span class="label">ADS</span>
              <span class="bar-track"><span class="bar-fill" style="width:${scoreBarWidth(company.ads)}"></span></span>
              <span class="value">${company.ads}</span>
            </div>
            <div class="profile-score-row ows">
              <span class="label">OWS</span>
              <span class="bar-track"><span class="bar-fill" style="width:${scoreBarWidth(company.ows)}"></span></span>
              <span class="value">${company.ows}</span>
            </div>
            <div class="profile-score-row rvs">
              <span class="label">RVS</span>
              <span class="bar-track"><span class="bar-fill" style="width:${scoreBarWidth(company.rvs)}"></span></span>
              <span class="value">${company.rvs}</span>
            </div>
            <div class="profile-ddi">
              <div>
                <span class="num">${ddi.toFixed(1)}</span>
                <span class="num-caption">DDI Score</span>
              </div>
              <span class="state-tag ${state.tag}" style="font-size:14px; padding:8px 16px;">${state.label}</span>
            </div>
          </div>

          <div class="profile-conclusion">
            <strong>Conclusion</strong>
            <p>${company.conclusion}</p>
          </div>

          <a href="index.html" class="btn btn-ghost">&larr; Back to all ratings</a>
        </div>
      </section>
    `;
  }

  document.addEventListener("DOMContentLoaded", renderProfile);
</script>

</body>
</html>
